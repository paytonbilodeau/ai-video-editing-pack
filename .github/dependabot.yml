version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/plugins/vibe-edit/skills/remotion/starter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: "/plugins/vibe-edit/skills/pre-edit/tools"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
