version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/09 Visual Storytelling and Motion System/starter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: "/05 Video Pre-Edit System"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
