name: Repository quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check public files and validation guardrails
        run: |
          python3 -B .github/scripts/check_repository.py
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install FFmpeg for media regression tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install isolated animation test runtime
        run: node "AI Video Editing Pack/skills/javascript-animation/tools/animate.mjs" setup "$RUNNER_TEMP/animation-runtime"
      - name: Validate the editing pack and six tool suites
        env:
          ANIMATION_RUNTIME: ${{ runner.temp }}/animation-runtime
        run: node validate-library.mjs
      - name: Check the motion starter
        working-directory: '09 Visual Storytelling and Motion System/starter'
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --audit-level=high
