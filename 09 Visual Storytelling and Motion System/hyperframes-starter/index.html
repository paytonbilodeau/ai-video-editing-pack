<!doctype html>
<html lang="en" data-composition-variables='[{"id":"transparent","type":"boolean","label":"Transparent background","default":false}]'><head><meta charset="utf-8"><title>One idea, one visual</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eceff2;}
#one-idea{width:100%;height:100%;background:#eceff2;font-family:Arial,sans-serif;color:#171717;}
.row{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:65px;}
.card{width:470px;height:240px;background:#fff;border:6px solid #222;border-radius:24px;display:grid;place-items:center;font-size:52px;font-weight:800;text-align:center;white-space:nowrap;opacity:0;}
.arrow{font-size:110px;width:150px;text-align:center;color:#444;opacity:0;}
</style></head><body>
<div id="one-idea" data-composition-id="one-idea" data-start="0" data-duration="5" data-width="1920" data-height="1080" data-fps="30">
  <div class="row"><div id="idea" class="card">ONE IDEA</div><div id="arrow" class="arrow">→</div><div id="visual" class="card">CLEAR VISUAL</div></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
if (window.__hyperframes.getVariables().transparent) {
  document.documentElement.style.background = "transparent";
  document.body.style.background = "transparent";
  document.getElementById("one-idea").style.background = "transparent";
}
const timeline = gsap.timeline({paused:true});
timeline.fromTo('#idea',{opacity:0},{opacity:1,duration:0.6,ease:'power2.out'},0);
timeline.fromTo('#arrow',{opacity:0},{opacity:1,duration:0.6,ease:'power2.out'},0.8);
timeline.fromTo('#visual',{opacity:0},{opacity:1,duration:0.6,ease:'power2.out'},1.4);
timeline.to('.row',{opacity:0,duration:0.5,ease:'power1.in'},4.5);
window.__timelines = window.__timelines || {};
window.__timelines['one-idea'] = timeline;
</script></body></html>
